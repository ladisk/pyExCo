name: Create a Release on Tag

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    # Must match the environment name set in the trusted publisher on PyPI.
    # Add protection rules (e.g. required reviewers) under Settings -> Environments.
    environment:
      name: pypi
      url: https://pypi.org/p/pyexco

    permissions:
      contents: write    # create the GitHub Release
      id-token: write    # PyPI Trusted Publishing (OIDC), no API token needed

    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine pytest
        pip install .

    # The tag must name the version that is already committed: the release is
    # built from the tagged commit as it is, nothing is rewritten or pushed.
    - name: Check that the tag matches the package version
      run: |
        tag="${GITHUB_REF#refs/tags/v}"
        toml=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
        init=$(python -c "import pyExCo; print(pyExCo.__version__)")
        echo "tag: $tag, pyproject.toml: $toml, pyExCo.__version__: $init"
        if [ "$tag" != "$toml" ] || [ "$tag" != "$init" ]; then
          echo "::error::Tag v$tag does not match the version in pyproject.toml ($toml) and pyExCo/__init__.py ($init). Run sync_version.py, commit, and tag again."
          exit 1
        fi

    - name: Test with pytest
      run: pytest

    - name: Build distribution
      run: |
        python -m build
        twine check --strict dist/*

    - name: Create GitHub Release and upload artifacts
      uses: softprops/action-gh-release@v3
      with:
        files: dist/*
        generate_release_notes: true

    # Publishing uses PyPI Trusted Publishing: configure this repository and
    # workflow file as a trusted publisher on PyPI (Your projects -> Publishing).
    # No PYPI_API_TOKEN secret is required.
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
